default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-executables-have-shebangs
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt # gofmt + goimports
      - id: golangci-lint-full # strict linters, see .golangci.yml
  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        files: (\.go|go\.mod|go\.sum)$
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test -race ./...
        language: system
        files: (\.go|go\.mod|go\.sum)$
        pass_filenames: false
      - id: git-guard-tests
        name: git guard hook tests
        entry: python3 .claude/hooks/test_git_guard.py
        language: system
        files: ^\.claude/hooks/
        pass_filenames: false
      - id: review-gate-tests
        name: review gate tests
        entry: python3 scripts/test_review_gate.py
        language: system
        files: ^scripts/(test_)?review_gate\.py$
        pass_filenames: false
      - id: review-gate
        name: review gate (3 Claude reviewers, >=2 approve)
        entry: python3 scripts/review_gate.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
