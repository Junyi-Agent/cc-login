version: "2"

run:
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over struct packing
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: unused-parameter
  exclusions:
    rules:
      # cc-login runs claude and security with arguments it builds itself
      # (a login's directory, a Keychain item name); there is no shell.
      - linters: [gosec]
        text: "G204"
        path: internal/(claude|creds)/
      # Reading files under the user's own data directory is the job.
      - linters: [gosec]
        text: "G304"
      # Tests write fixture files with fixed modes in a temporary directory.
      - linters: [gosec]
        path: _test\.go
        text: "G306"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Junyi-Agent/cc-login
