version: 2

project_name: cc-login

builds:
  - main: ./cmd/cc-login
    binary: cc-login
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w, "-X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    # no version in the name, so releases/latest/download/<name> is a fixed URL (install.sh)
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, docs/usage.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
